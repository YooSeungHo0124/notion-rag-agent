# Infra only. The app runs in the local uv venv so that `claude -p`
# can use the host's subscription login without copying credentials into a container.
services:
  qdrant:
    image: qdrant/qdrant:v1.15.4
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - ./volumes/qdrant:/qdrant/storage
    restart: unless-stopped

  phoenix:
    image: arizephoenix/phoenix:version-11.38.0
    ports:
      - "127.0.0.1:6006:6006"   # UI
      - "127.0.0.1:4317:4317"   # OTLP gRPC
    volumes:
      - ./volumes/phoenix:/mnt/data
    environment:
      - PHOENIX_WORKING_DIR=/mnt/data
    restart: unless-stopped

  # --- Demo ERP/CRM (Odoo Community + its own Postgres). Local only. ---
  odoo-db:
    image: postgres:16.4
    environment:
      - POSTGRES_USER=odoo
      - POSTGRES_PASSWORD=${ODOO_DB_PASSWORD:-odoo}
      - POSTGRES_DB=postgres
    volumes:
      - ./volumes/odoo-db:/var/lib/postgresql/data
    networks: [erp]
    restart: unless-stopped

  odoo:
    image: odoo:18.0
    depends_on: [odoo-db]
    environment:
      - HOST=odoo-db
      - USER=odoo
      - PASSWORD=${ODOO_DB_PASSWORD:-odoo}
    ports:
      - "127.0.0.1:8069:8069"
    volumes:
      - odoo-data:/var/lib/odoo
    networks: [erp]
    restart: unless-stopped

networks:
  erp: {}

volumes:
  odoo-data: {}
