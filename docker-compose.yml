# Infra (qdrant, phoenix, odoo) starts by default. The app itself normally runs in the local
# uv venv so `claude -p` can use the host's subscription login; the containerized app
# (profile "app") uses the Anthropic API instead:
#   ANTHROPIC_API_KEY=... docker compose --profile app up -d --build app
services:
  qdrant:
    image: qdrant/qdrant:v1.15.4
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - ./volumes/qdrant:/qdrant/storage
    restart: unless-stopped

  phoenix:
    image: arizephoenix/phoenix:version-11.38.0
    ports:
      - "127.0.0.1:6006:6006"   # UI
      - "127.0.0.1:4317:4317"   # OTLP gRPC
    volumes:
      - ./volumes/phoenix:/mnt/data
    environment:
      - PHOENIX_WORKING_DIR=/mnt/data
    restart: unless-stopped

  # --- Demo ERP/CRM (Odoo Community + its own Postgres). Local only. ---
  odoo-db:
    image: postgres:16.4
    environment:
      - POSTGRES_USER=odoo
      - POSTGRES_PASSWORD=${ODOO_DB_PASSWORD:-odoo}
      - POSTGRES_DB=postgres
    volumes:
      - ./volumes/odoo-db:/var/lib/postgresql/data
    networks: [erp]
    restart: unless-stopped

  odoo:
    image: odoo:18.0
    depends_on: [odoo-db]
    environment:
      - HOST=odoo-db
      - USER=odoo
      - PASSWORD=${ODOO_DB_PASSWORD:-odoo}
    ports:
      - "127.0.0.1:8069:8069"
    volumes:
      - odoo-data:/var/lib/odoo
    networks: [erp]
    restart: unless-stopped

  # --- The app (profile "app"): UI + API on GPU, LLM via Anthropic API. ---
  app:
    profiles: ["app"]
    build: .
    image: notion-rag-agent:latest
    ports:
      - "127.0.0.1:8000:8000"   # no auth: keep it local
    env_file: [.env]
    environment:
      - LLM_PROVIDER=anthropic_api
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ODOO_URL=http://odoo:8069
      - QDRANT_PATH=/app/data/qdrant
      - STATE_DB=/app/data/state.db
    volumes:
      - ./data:/app/data                     # index + state (embedded Qdrant: stop the local server first)
      - ${HF_HOME:-${HOME}/.cache/huggingface}:/models   # model weights, not baked into the image
    networks: [default, erp]
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, count: 1, capabilities: [gpu]}]
    restart: unless-stopped

networks:
  erp: {}

volumes:
  odoo-data: {}
