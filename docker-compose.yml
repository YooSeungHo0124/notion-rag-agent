# Infra (qdrant, phoenix, odoo) starts by default. The app itself normally runs in the local
# uv venv so `claude -p` can use the host's subscription login; the containerized app
# (profile "app") uses the Anthropic API instead:
#   ANTHROPIC_API_KEY=... docker compose --profile app up -d --build app
services:
  qdrant:
    image: qdrant/qdrant:v1.15.4
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - ./volumes/qdrant:/qdrant/storage
    restart: unless-stopped

  phoenix:
    image: arizephoenix/phoenix:version-11.38.0
    ports:
      - "127.0.0.1:6006:6006"   # UI
      - "127.0.0.1:4317:4317"   # OTLP gRPC
    volumes:
      - ./volumes/phoenix:/mnt/data
    environment:
      - PHOENIX_WORKING_DIR=/mnt/data
    restart: unless-stopped

  # --- Demo ERP/CRM (Odoo Community + its own Postgres). Local only. ---
  odoo-db:
    image: postgres:16.4
    environment:
      - POSTGRES_USER=odoo
      - POSTGRES_PASSWORD=${ODOO_DB_PASSWORD:-odoo}
      - POSTGRES_DB=postgres
    volumes:
      - ./volumes/odoo-db:/var/lib/postgresql/data
    networks: [erp]
    restart: unless-stopped

  odoo:
    image: odoo:18.0
    depends_on: [odoo-db]
    environment:
      - HOST=odoo-db
      - USER=odoo
      - PASSWORD=${ODOO_DB_PASSWORD:-odoo}
    ports:
      - "127.0.0.1:8069:8069"
    volumes:
      - odoo-data:/var/lib/odoo
    networks: [erp]
    restart: unless-stopped

  # --- The app (profile "app"): UI + API on GPU, LLM via Anthropic API. ---
  app:
    profiles: ["app"]
    build: .
    image: notion-rag-agent:latest
    ports:
      - "127.0.0.1:8000:8000"   # no auth: keep it local
    env_file: [.env]
    environment:
      - LLM_PROVIDER=anthropic_api
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ODOO_URL=http://odoo:8069
      - QDRANT_PATH=/app/data/qdrant
      - STATE_DB=/app/data/state.db
    volumes:
      - ./data:/app/data                     # index + state (embedded Qdrant: stop the local server first)
      - ${HF_HOME:-${HOME}/.cache/huggingface}:/models   # model weights, not baked into the image
    networks: [default, erp]
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, count: 1, capabilities: [gpu]}]
    restart: unless-stopped

  # --- Scheduler (profile "airflow"): nightly sync -> eval -> quality gate (dags/). ---
  # Host network so it can reach the app on 127.0.0.1:8000; its UI is bound to 127.0.0.1.
  airflow:
    profiles: ["airflow"]
    image: apache/airflow:3.0.6-python3.12
    command: standalone
    network_mode: host
    user: "${AIRFLOW_UID:-1000}:0"
    environment:
      - AIRFLOW__API__HOST=127.0.0.1
      - AIRFLOW__API__PORT=8080
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION=True
      - PYTHONPATH=/opt/nra
      - NRA_API=http://127.0.0.1:8000
      - MLFLOW_DISABLE_AGENT_HINT=1
      - GIT_CONFIG_COUNT=1
      - GIT_CONFIG_KEY_0=safe.directory
      - GIT_CONFIG_VALUE_0=/opt/nra
      - _PIP_ADDITIONAL_REQUIREMENTS=mlflow==3.18.0
    volumes:
      - ./dags:/opt/airflow/dags:ro
      - ./eval:/opt/nra/eval            # eval code + run outputs
      - ./mlruns:/opt/nra/mlruns        # shared MLflow store
      - ./.git:/opt/nra/.git:ro         # so runs are tagged with the commit
      - ./src:/opt/nra/src:ro           # (git dirty check)
      - airflow-home:/opt/airflow
    restart: unless-stopped

networks:
  erp: {}

volumes:
  odoo-data: {}
  airflow-home: {}
