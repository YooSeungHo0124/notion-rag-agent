[project]
name = "notion-rag-agent"
version = "0.1.0"
description = "Personal Notion AI agent: hybrid RAG, LangGraph tool-calling, MCP, grounded citations & evaluation"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
# F1: Notion ingestion
ingest = ["notion-client>=2.2"]
# F2: embeddings / vector store (torch is installed from the CUDA index, see [tool.uv])
rag = [
    "torch>=2.7",
    "transformers>=4.51",
    "sentence-transformers>=4.1",
    "FlagEmbedding>=1.3",
    "qdrant-client>=1.15",
]
# F7: web UI server
api = ["fastapi>=0.115", "uvicorn[standard]>=0.30"]

[project.scripts]
nra = "notion_agent.cli:app"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/notion_agent"]

# RTX 5080 (Blackwell, sm_120) needs CUDA 12.8+ wheels.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff.lint.per-file-ignores]
"eval/*" = ["E501"]  # long Korean prompt/report strings
