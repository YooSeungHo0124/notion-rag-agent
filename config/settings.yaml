llm:
  timeout_s: 180
  max_retries: 2

chunking:
  max_chars: 1200
  overlap_chars: 150
  min_chars: 200

embedding:
  dense_model: Qwen/Qwen3-Embedding-4B
  sparse_model: BAAI/bge-m3
  device: cuda
  batch_size: 16

retrieval:
  collection: notion_chunks
  candidate_k: 50
  final_k: 5
  reranker_model: BAAI/bge-reranker-v2-m3
  # LoRA from training/rerank_ft.py (e.g. data/rerank/champion = nra-reranker@champion).
  # Off: the champion did not change production R@1 (40q) and shifted score calibration
  # below min_rerank_score on 1 answerable question. See README "재정렬 모델 파인튜닝".
  reranker_adapter: ""
  min_rerank_score: 0.2
